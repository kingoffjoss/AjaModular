<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>AjaModular — Teste isolado</title><style>body{font:16px system-ui;margin:30px}textarea{width:550px;height:100px}.platform-test-button{padding:21px;background:rgb(240,240,240);color:rgb(18,52,86)}#test-errors{color:red;white-space:pre-wrap}</style><h1>Teste isolado de AjaModular</h1><p>Sem conta Genesys e sem chamadas externas. O corretor recebe respostas simuladas.</p><textarea aria-label="Mensagem de teste">Brisanet</textarea><button class="close-btn platform-test-button" aria-label="Controle da plataforma">Controle da plataforma</button><label>Simular atualização (somente teste): <select id="test-release-mode"><option value="1.6.25">Versão atual</option><option value="1.7.0">Atualização disponível</option><option value="error">Falha na consulta</option></select></label><pre id="test-errors"></pre><script>
const errors=[]; const originalError=console.error;
console.error=(...args)=>{errors.push(args.map(String).join(' '));document.getElementById('test-errors').textContent=errors.join('\n');originalError(...args)};
addEventListener('error',event=>console.error(event.message));addEventListener('unhandledrejection',event=>console.error(event.reason));
window.fetch=async(url,options)=>String(url).includes('/manifest.json')?{ok:document.getElementById('test-release-mode').value!=='error',status:document.getElementById('test-release-mode').value==='error'?503:200,json:async()=>({version:document.getElementById('test-release-mode').value})}:({ok:true,status:200,json:async()=>String(url).includes('languagetool')?{matches:[{offset:0,length:8,context:{text:'Brisanet',offset:0,length:8},message:'Palavra desconhecida',replacements:[{value:'Internet'}],rule:{issueType:'misspelling',category:{id:'TYPOS',name:'Ortografia'}}}]}:[],text:async()=>'[]'});
window.chrome=undefined;
</script><script src="../runtime/content.bundle.js?v=1.6.25"></script><script src="../runtime/content.bundle.js?v=1.6.25"></script></html>
